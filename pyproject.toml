[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "assetflow"
version = "0.1.0"
description = "AssetFlow backend"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.0.0",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Login==0.6.3",
    "python-dotenv==1.0.1",
    "pydantic==2.6.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "database", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
