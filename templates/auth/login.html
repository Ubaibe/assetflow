<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Wallet - AssetFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container auth-center">
        <div class="auth-card">
            <div class="logo"><span>AssetFlow</span></div>
            <p class="subtitle" id="subtitle">Use your EVM wallet to securely access AssetFlow.</p>

            <div id="walletSection" style="display: none;">
                <div class="wallet-display">
                    <span id="walletAddressDisplay"></span>
                </div>
                <button id="disconnectBtn" class="btn btn-secondary" style="margin-top: 0.5rem; width: 100%;">Disconnect</button>
                <button id="switchNetworkBtn" class="btn btn-secondary" style="margin-top: 0.5rem; width: 100%; display: none;">Switch to BOT Chain Testnet</button>
            </div>

            <button id="connectBtn" class="btn btn-primary" style="width: 100%;">Connect Wallet</button>

            <div id="message" class="message" style="margin-top: 1rem; padding: 0.75rem 1rem; border-radius: 0.5rem; font-size: 0.9rem; display: none;"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script>
        (function() {
            let abortAuth = false;

            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            const switchNetworkBtn = document.getElementById('switchNetworkBtn');
            const walletSection = document.getElementById('walletSection');
            const walletAddressDisplay = document.getElementById('walletAddressDisplay');
            const subtitle = document.getElementById('subtitle');
            const messageEl = document.getElementById('message');

            const EXPECTED_CHAIN_ID = {{ chain_id | tojson }};
            const NEXT_URL = {{ next_url | tojson }};

            function showMessage(text, type) {
                messageEl.textContent = text;
                messageEl.className = 'message ' + type;
                messageEl.style.display = text ? 'block' : 'none';
            }

            function setState(state, data) {
                connectBtn.style.display = 'none';
                disconnectBtn.style.display = 'none';
                switchNetworkBtn.style.display = 'none';
                walletSection.style.display = 'none';
                showMessage('', '');

                switch (state) {
                    case 'initial':
                        connectBtn.style.display = 'block';
                        subtitle.textContent = 'Use your EVM wallet to securely access AssetFlow.';
                        break;
                    case 'connecting':
                        connectBtn.style.display = 'block';
                        connectBtn.disabled = true;
                        connectBtn.textContent = 'Connecting wallet...';
                        subtitle.textContent = 'Please confirm the connection in your wallet.';
                        break;
                    case 'connected':
                        walletSection.style.display = 'block';
                        disconnectBtn.style.display = 'block';
                        if (EXPECTED_CHAIN_ID) {
                            switchNetworkBtn.style.display = 'block';
                        }
                        walletAddressDisplay.textContent = AssetFlowWalletAuth.shortenAddress(data.address);
                        subtitle.textContent = 'Wallet connected. Please approve the authentication signature in MetaMask.';
                        break;
                    case 'authenticating':
                        subtitle.textContent = 'Waiting for wallet signature...';
                        break;
                    case 'success':
                        subtitle.textContent = 'Authentication successful! Redirecting...';
                        break;
                    case 'error':
                        connectBtn.style.display = 'block';
                        connectBtn.disabled = false;
                        connectBtn.textContent = 'Connect Wallet';
                        subtitle.textContent = 'Use your EVM wallet to securely access AssetFlow.';
                        break;
                }
            }

            async function runAuthentication(address) {
                setState('authenticating');
                showMessage('', '');
                abortAuth = false;

                try {
                    const challenge = await AssetFlowWalletAuth.requestChallenge(address);
                    if (abortAuth) return;

                    const signature = await AssetFlowWalletAuth.signMessage(challenge.message);
                    if (abortAuth) return;

                    const result = await AssetFlowWalletAuth.verifySignature(address, signature, challenge.challenge_id);
                    if (abortAuth) return;

                    if (result.error) {
                        throw new Error(result.error);
                    }

                    setState('success');
                    setTimeout(() => {
                        const role = result.role;
                        if (role === 'investor') {
                            window.location.href = '/investor/dashboard';
                        } else if (role === 'borrower') {
                            window.location.href = '/borrower/dashboard';
                        } else {
                            window.location.href = '/auth/onboarding?next=' + encodeURIComponent(NEXT_URL || '/');
                        }
                    }, 500);
                } catch (err) {
                    showMessage(err.message || 'Authentication failed.', 'error');
                    setState('error');
                }
            }

            connectBtn.addEventListener('click', async () => {
                setState('connecting');
                showMessage('', '');
                abortAuth = false;

                try {
                    const address = await AssetFlowWalletAuth.connectWallet();
                    if (abortAuth) return;

                    let networkOk = true;
                    if (EXPECTED_CHAIN_ID) {
                        try {
                            await AssetFlowWalletAuth.checkNetwork(EXPECTED_CHAIN_ID);
                        } catch (networkErr) {
                            networkOk = false;
                            showMessage(networkErr.message || 'Please switch your wallet to BOT Chain Testnet.', 'error');
                        }
                    }
                    if (abortAuth) return;

                    setState('connected', { address });

                    if (networkOk) {
                        await runAuthentication(address);
                    }
                } catch (err) {
                    showMessage(err.message || 'Wallet connection failed.', 'error');
                    setState('error');
                }
            });

            disconnectBtn.addEventListener('click', async () => {
                abortAuth = true;
                await AssetFlowWalletAuth.logout();
                setState('initial');
            });

            switchNetworkBtn.addEventListener('click', async () => {
                switchNetworkBtn.disabled = true;
                switchNetworkBtn.textContent = 'Switching...';
                showMessage('', '');

                try {
                    await AssetFlowWalletAuth.switchNetwork(EXPECTED_CHAIN_ID);
                    showMessage('Switched to BOT Chain Testnet.', 'success');
                    switchNetworkBtn.disabled = false;
                    switchNetworkBtn.textContent = 'Switch to BOT Chain Testnet';
                    
                    const address = AssetFlowWalletAuth.connectedAddress;
                    if (address) {
                        await runAuthentication(address);
                    }
                } catch (err) {
                    showMessage(err.message || 'Failed to switch network.', 'error');
                    switchNetworkBtn.disabled = false;
                    switchNetworkBtn.textContent = 'Switch to BOT Chain Testnet';
                }
            });

            if (window.ethereum) {
                window.ethereum.on('accountsChanged', (accounts) => {
                    if (accounts.length === 0) {
                        AssetFlowWalletAuth.setConnectedAddress(null);
                        abortAuth = true;
                        setState('initial');
                    } else {
                        AssetFlowWalletAuth.setConnectedAddress(accounts[0]);
                        abortAuth = true;
                        setState('connected', { address: accounts[0] });
                    }
                });

                window.ethereum.on('chainChanged', () => {
                    abortAuth = true;
                    setState('initial');
                });
            }

            setState('initial');
        })();
    </script>
</body>
</html>
