<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Wallet - AssetFlow</title>
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1f2937;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --error: #ef4444;
            --border: #374151;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 420px;
            width: 100%;
            padding: 1.5rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .logo span {
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
            text-align: center;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover { background: var(--accent-hover); }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .message {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            display: none;
        }

        .message.error {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--error);
        }

        .message.success {
            display: block;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--success);
        }

        .wallet-display {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            text-align: center;
            font-family: monospace;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
        }

        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
        }

        .footer a:hover { color: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo"><span>AssetFlow</span></div>
            <p class="subtitle" id="subtitle">Use your EVM wallet to securely access AssetFlow.</p>

            <div id="walletSection" style="display: none;">
                <div class="wallet-display">
                    <span id="walletAddressDisplay"></span>
                </div>
                <button id="authenticateBtn" class="btn btn-primary">Authenticate</button>
                <button id="disconnectBtn" class="btn btn-secondary" style="margin-top: 0.5rem;">Disconnect</button>
            </div>

            <button id="connectBtn" class="btn btn-primary">Connect Wallet</button>

            <div id="message" class="message"></div>
        </div>

        <div class="footer">
            <a href="/">Back to AssetFlow</a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script>
        (function() {
            const connectBtn = document.getElementById('connectBtn');
            const authenticateBtn = document.getElementById('authenticateBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            const walletSection = document.getElementById('walletSection');
            const walletAddressDisplay = document.getElementById('walletAddressDisplay');
            const subtitle = document.getElementById('subtitle');
            const messageEl = document.getElementById('message');

            const EXPECTED_CHAIN_ID = {{ chain_id | tojson }};
            const NEXT_URL = {{ next_url | tojson }};

            function showMessage(text, type) {
                messageEl.textContent = text;
                messageEl.className = 'message ' + type;
                messageEl.style.display = text ? 'block' : 'none';
            }

            function setState(state, data) {
                connectBtn.style.display = 'none';
                authenticateBtn.disabled = false;
                authenticateBtn.textContent = 'Authenticate';
                disconnectBtn.style.display = 'none';
                walletSection.style.display = 'none';
                showMessage('', '');

                switch (state) {
                    case 'initial':
                        connectBtn.style.display = 'block';
                        subtitle.textContent = 'Use your EVM wallet to securely access AssetFlow.';
                        break;
                    case 'connecting':
                        connectBtn.style.display = 'block';
                        connectBtn.disabled = true;
                        connectBtn.textContent = 'Connecting wallet...';
                        subtitle.textContent = 'Please confirm the connection in your wallet.';
                        break;
                    case 'connected':
                        walletSection.style.display = 'block';
                        authenticateBtn.style.display = 'block';
                        disconnectBtn.style.display = 'block';
                        walletAddressDisplay.textContent = AssetFlowWalletAuth.shortenAddress(data.address);
                        subtitle.textContent = 'Wallet connected. Click Authenticate to continue.';
                        break;
                    case 'authenticating':
                        authenticateBtn.disabled = true;
                        authenticateBtn.textContent = 'Authenticating...';
                        subtitle.textContent = 'Please sign the message in your wallet.';
                        break;
                    case 'success':
                        subtitle.textContent = 'Authentication successful! Redirecting...';
                        break;
                    case 'error':
                        connectBtn.style.display = 'block';
                        connectBtn.disabled = false;
                        connectBtn.textContent = 'Connect Wallet';
                        subtitle.textContent = 'Use your EVM wallet to securely access AssetFlow.';
                        break;
                }
            }

            connectBtn.addEventListener('click', async () => {
                setState('connecting');
                showMessage('', '');

                try {
                    const address = await AssetFlowWalletAuth.connectWallet();

                    if (EXPECTED_CHAIN_ID) {
                        await AssetFlowWalletAuth.checkNetwork(EXPECTED_CHAIN_ID);
                    }

                    setState('connected', { address });
                } catch (err) {
                    showMessage(err.message || 'Wallet connection failed.', 'error');
                    setState('error');
                }
            });

            authenticateBtn.addEventListener('click', async () => {
                setState('authenticating');
                showMessage('', '');

                try {
                    const address = AssetFlowWalletAuth.connectedAddress || await AssetFlowWalletAuth.connectWallet();
                    const challenge = await AssetFlowWalletAuth.requestChallenge(address);
                    const signature = await AssetFlowWalletAuth.signMessage(challenge.message);
                    const result = await AssetFlowWalletAuth.verifySignature(address, signature, challenge.challenge_id);

                    if (result.error) {
                        throw new Error(result.error);
                    }

                    setState('success');
                    setTimeout(() => {
                        window.location.href = NEXT_URL;
                    }, 500);
                } catch (err) {
                    showMessage(err.message || 'Authentication failed.', 'error');
                    setState('error');
                }
            });

            disconnectBtn.addEventListener('click', async () => {
                await AssetFlowWalletAuth.logout();
                setState('initial');
            });

            if (window.ethereum) {
                window.ethereum.on('accountsChanged', (accounts) => {
                    if (accounts.length === 0) {
                        setState('initial');
                    } else {
                        setState('connected', { address: accounts[0] });
                    }
                });

                window.ethereum.on('chainChanged', () => {
                    setState('initial');
                });
            }

            setState('initial');
        })();
    </script>
</body>
</html>
