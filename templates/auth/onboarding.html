<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - AssetFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container auth-center">
        <div class="auth-card">
            <div class="logo"><span>AssetFlow</span></div>
            <p class="subtitle">Welcome to AssetFlow. Choose how you want to explore the platform.</p>

            <div class="wallet-display" style="margin-bottom: 1.5rem;">
                {{ wallet_address }}
            </div>

            <div class="role-grid">
                <div class="role-card" id="borrowerCard">
                    <h3>Borrower</h3>
                    <p>Create and manage invoice-backed financing assets.</p>
                </div>
                <div class="role-card" id="investorCard">
                    <h3>Investor</h3>
                    <p>Explore financing opportunities and fund invoice-backed assets.</p>
                </div>
            </div>

            <div id="message" class="message" style="margin-top: 1rem; padding: 0.75rem 1rem; border-radius: 0.5rem; font-size: 0.9rem; display: none;"></div>
        </div>
    </div>

    <script>
        (function() {
            const NEXT_URL = {{ next_url | tojson }};
            const messageEl = document.getElementById('message');

            function showMessage(text, type) {
                messageEl.textContent = text;
                messageEl.className = 'message ' + type;
                messageEl.style.display = text ? 'block' : 'none';
            }

            async function selectRole(role) {
                showMessage('', '');
                try {
                    const response = await fetch("/auth/onboarding/role", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ role: role, next: NEXT_URL }),
                    });
                    if (!response.ok) {
                        const data = await response.json();
                        throw new Error(data.error || "Failed to select role");
                    }
                    const result = await response.json();
                    showMessage("Role selected! Redirecting...", "success");
                    setTimeout(() => {
                        window.location.href = result.next || "/";
                    }, 500);
                } catch (err) {
                    showMessage(err.message || "Failed to select role.", "error");
                }
            }

            document.getElementById('borrowerCard').addEventListener('click', () => selectRole('borrower'));
            document.getElementById('investorCard').addEventListener('click', () => selectRole('investor'));
        })();
    </script>
</body>
</html>
