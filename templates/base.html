<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AssetFlow{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .nav a { margin-right: 1rem; }
        .alert { padding: 0.75rem 1rem; border-radius: 0.25rem; margin-bottom: 1rem; }
        .alert.success { background: #d4edda; color: #155724; }
        .alert.error { background: #f8d7da; color: #721c24; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ddd; }
        .btn { display: inline-block; padding: 0.5rem 1rem; background: #0d6efd; color: white; text-decoration: none; border-radius: 0.25rem; }
        .btn-secondary { background: #6c757d; }
    </style>
</head>
<body>
    <div class="header">
        <h1>AssetFlow</h1>
        <nav class="nav">
            <a href="/borrower/dashboard">Borrower</a>
            <a href="/investor/dashboard">Investor</a>
            {% if current_user.is_authenticated %}
                <a href="/auth/logout" onclick="event.preventDefault(); document.getElementById('logout-form').submit();">Logout</a>
                <form id="logout-form" action="/auth/logout" method="post" style="display:none;"></form>
            {% endif %}
        </nav>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</body>
</html>
